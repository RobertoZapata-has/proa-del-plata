<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#0f2a52">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="iconos/icon-192.png">
<link rel="apple-touch-icon" href="iconos/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Batalla naval en el Río de la Plata, 1814. Patriotas contra realistas. Online con un amigo o contra la compu.">
<title>Proa del Plata</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script type="importmap">{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}</script>
<style>
:root{
  /* animé de barcos: mar de día, sombrero de paja, contorno blanco sobre marino */
  --marino:#0f2a52; --marino2:#163a6e; --agua:#1fb5e8; --agua2:#9fe7ff; --paja:#ffd23a; --naranja:#ff8a1f; --rojo:#e8312a; --rojo2:#ffb59c;
  --tinta:#0f2a52; --suave:#4b5f7a; --papel:#ffffff; --crema:#f4f8ff; --oro:#ffd23a; --oro2:#ffe27a;
  --sangre:#e8312a; --sangre2:#ff6a4a; --azul:#1f6fb5; --celeste:#9fe7ff; --gris:#9fb0c6;
  --panel:rgba(15,42,82,.82);
  --st:env(safe-area-inset-top); --sb:env(safe-area-inset-bottom);
  --dela:"Dela Gothic One","Arial Black",Impact,sans-serif; --redonda:"M PLUS Rounded 1c","Nunito",system-ui,sans-serif;
  --serif:var(--redonda); --sc:var(--dela);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--marino);color:var(--crema);overflow:hidden;font-family:var(--redonda);font-weight:500;
  touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
button{font-family:inherit;color:inherit}
b,strong{font-weight:800}
#lienzo{position:fixed;inset:0;width:100%;height:100%;display:block}
[hidden]{display:none!important}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- arriba: etiqueta del turno + flotas ---------- */
#arriba{position:fixed;left:0;right:0;top:0;padding:calc(var(--st) + 8px) 8px 0;display:flex;flex-direction:column;gap:6px;pointer-events:none;z-index:10}
#arriba > *{pointer-events:auto}
.fila1{display:flex;align-items:center;gap:6px}
.redondo{width:36px;height:36px;border-radius:50%;border:2.5px solid #fff;background:linear-gradient(var(--agua),#1272b8);box-shadow:0 0 0 2px var(--marino),0 3px 0 var(--marino);display:grid;place-items:center;cursor:pointer;padding:0;flex:none;position:relative;color:#fff}
.redondo svg.i{width:18px;height:18px}
.redondo:active{transform:translateY(2px);box-shadow:0 0 0 2px var(--marino)}
.redondo .punto{position:absolute;top:-3px;right:-3px;width:12px;height:12px;border-radius:50%;background:var(--paja);border:2px solid var(--marino)}
#cartel{flex:0 1 auto;margin:0 auto;min-width:0;max-width:62%;display:flex;align-items:center;justify-content:center;background:var(--marino2);color:#fff;border:2px solid #fff;
  box-shadow:0 0 0 2px var(--marino),3px 3px 0 var(--marino);padding:3px 14px;transform:skewX(-12deg);transition:background .3s}
#cartelT{transform:skewX(12deg);font-family:var(--dela);font-size:14px;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase;-webkit-text-stroke:.5px var(--marino);text-shadow:1.5px 1.5px 0 var(--marino)}
#cartelS{display:none}
#cartel.mio{background:linear-gradient(100deg,var(--rojo),var(--naranja))}
.flotas{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.flota{min-width:0;display:grid;gap:3px;background:rgba(15,42,82,.74);border:1.5px solid rgba(255,255,255,.85);border-radius:4px;padding:3px 7px 5px;transform:skewX(-8deg)}
.flota + .flota{transform:skewX(8deg);justify-items:end}
.flota b{font-family:var(--dela);font-weight:400;font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.flota.p b{color:var(--agua2)} .flota.r b{color:var(--rojo2)}
.pips{display:flex;gap:5px;flex-wrap:nowrap}
.nave{display:flex;gap:1.5px;position:relative}
.nave i{width:7px;height:11px;border-radius:1.5px;display:block;background:currentColor}
.flota.p .nave{color:#7fdcff} .flota.r .nave{color:#ff7b62}
.flota.p .nave i{background:linear-gradient(#cdf4ff,var(--agua))} .flota.r .nave i{background:linear-gradient(#ffd0c2,var(--rojo))}
.nave i.t{background:linear-gradient(var(--paja),var(--naranja))!important}
.nave.hundida i{background:#2a3550!important}
.nave.hundida::after{content:"";position:absolute;left:-2px;right:-2px;top:50%;height:2px;margin-top:-1px;background:var(--rojo);transform:rotate(-16deg);box-shadow:0 0 0 .6px #fff}

/* ---------- abajo: bandeja ---------- */
#abajo{position:fixed;left:0;right:0;bottom:0;padding:0 0 0;z-index:10;pointer-events:none}
#abajo > *{pointer-events:auto}
.tabla{background:linear-gradient(172deg,#1a4280,var(--marino) 55%);color:#fff;padding:20px 10px calc(var(--sb) + 12px);clip-path:polygon(0 12px,100% 0,100% 100%,0 100%);position:relative}
.tabla::before{content:"";position:absolute;left:0;right:0;top:0;height:14px;background:linear-gradient(transparent 0 60%,rgba(255,255,255,.0));}
.tabla h3{margin:0 0 6px;font-family:var(--dela);font-weight:400;font-size:15px;display:flex;align-items:center;gap:8px;text-transform:uppercase;letter-spacing:.03em}
.tabla h3 small{font-family:var(--redonda);font-weight:800;font-size:11.5px;color:var(--agua2);margin-left:auto;text-transform:none;letter-spacing:0}
.fichas{display:flex;gap:4px;overflow-x:auto;padding:4px 2px 8px;margin:0 -2px;scrollbar-width:none}
.fichas::-webkit-scrollbar{display:none}
.ficha{flex:1 0 auto;min-width:62px;border:0;background:none;padding:0 2px;text-align:center;cursor:pointer;color:#fff;position:relative;display:flex;flex-direction:column;align-items:center;gap:3px}
.ficha .hx{width:46px;height:41px;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);background:linear-gradient(#2a8fd8,#1458a0);display:grid;place-items:center;transition:transform .15s}
.ficha .hx svg.i{width:24px;height:24px;stroke-width:2.6}
.ficha .n{font-weight:800;font-size:11.5px;white-space:nowrap;line-height:1.1}
.ficha .d{display:none}
.ficha.sel .hx{background:linear-gradient(var(--paja),var(--naranja));transform:scale(1.08) rotate(-4deg)}
.ficha.sel .n{color:var(--paja)}
.ficha[disabled]{opacity:.38;cursor:default}
.ficha .tag{position:absolute;top:-4px;right:2px;font-size:9px;font-weight:800;background:var(--rojo);color:#fff;border:1.5px solid #fff;border-radius:6px;padding:0 4px;z-index:1}
/* fichas de barco (al acomodar la flota) */
.ficha.barco{flex:none;min-width:78px;max-width:120px;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.5);border-radius:8px;padding:6px 8px;transform:skewX(-8deg);align-items:flex-start;text-align:left}
.ficha.barco > *{transform:skewX(8deg)}
.ficha.barco .n{font-size:12.5px}
.ficha.barco .d{display:block;font-size:10.5px;color:var(--agua2)}
.ficha.barco .nave{color:var(--agua);margin:1px 0}
.ficha.barco .nave i{background:linear-gradient(#cdf4ff,var(--agua))}
.ficha.barco.sel{background:linear-gradient(var(--paja),var(--naranja));border-color:#fff;color:var(--marino)}
.ficha.barco.sel .d{color:var(--marino)}
.ficha.barco.mal{border-color:var(--rojo);background:rgba(232,49,42,.35)}
.botones{display:flex;gap:8px;margin-top:2px;padding:0 4px}
.btn{flex:1;border:2.5px solid #fff;border-radius:7px;padding:9px 10px;font-size:15px;font-weight:800;background:linear-gradient(#2a8fd8,#1458a0);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px;
  transform:skewX(-10deg);box-shadow:0 4px 0 #06142b;text-shadow:0 1px 0 #0006}
.btn > *{transform:skewX(10deg)}
.btn:active{transform:skewX(-10deg) translateY(3px);box-shadow:0 1px 0 #06142b}
.btn[disabled]{opacity:.45;cursor:default}
.btn.fuego{background:linear-gradient(var(--paja),var(--naranja) 72%);color:#fff;font-family:var(--dela);font-weight:400;font-size:17px;letter-spacing:.02em;flex:2;-webkit-text-stroke:.8px var(--marino);text-shadow:2px 2px 0 var(--marino);box-shadow:0 4px 0 #8a3c06,0 0 14px rgba(255,180,40,.45)}
.btn.fuego svg.i{stroke:var(--marino)}
.btn.fuego:active{box-shadow:0 1px 0 #8a3c06}
.btn.azul{background:linear-gradient(#45c4f2,#1f8fd0)}
.btn.chico{flex:none;padding:9px 12px}
#msjAbajo{font-size:12.5px;font-weight:500;color:#d6ecff;margin:0 4px 4px;min-height:16px;line-height:1.25}
#msjAbajo b{color:var(--paja)}
.espera{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:800;padding:0 4px}
.ola-anim{width:34px;height:20px;flex:none}

/* ---------- avisos ---------- */
#avisos{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--st) + 112px);z-index:20;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;width:min(92vw,420px)}
.aviso{background:var(--panel);border:2px solid #fff;color:#fff;padding:6px 14px;border-radius:99px;font-size:13.5px;font-weight:800;text-align:center;box-shadow:0 0 0 1.5px var(--marino),0 4px 14px #0007;animation:entra .25s ease-out;max-width:100%}
.aviso.oro{background:linear-gradient(var(--paja),var(--naranja));color:var(--marino)}
.aviso.rojo{background:linear-gradient(var(--rojo),#a51d17)}
.aviso.botella{background:#fff;color:var(--marino);border-color:var(--marino);border-radius:12px}
@keyframes entra{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.aviso.sale{opacity:0;transition:opacity .4s}

#grito{position:fixed;inset:0;z-index:30;display:grid;place-items:center;pointer-events:none}
#grito .g{font-family:var(--dela);font-size:clamp(44px,14vw,96px);color:var(--paja);-webkit-text-stroke:3px var(--marino);
  text-shadow:5px 5px 0 var(--marino),-2px -2px 0 #fff,2px -2px 0 #fff,-2px 2px 0 #fff;transform:rotate(-6deg);animation:grito 1.6s cubic-bezier(.2,1.6,.4,1) both;text-align:center;line-height:.95}
#grito .g small{display:block;font-family:var(--redonda);font-weight:800;font-size:.24em;-webkit-text-stroke:0;color:#fff;text-shadow:0 2px 8px #000;margin-top:10px}
#grito.azul .g{color:#bff0ff}
@keyframes grito{0%{transform:scale(2.4) rotate(-12deg);opacity:0}22%{transform:scale(1) rotate(-6deg);opacity:1}30%{transform:translate(-4px,2px) rotate(-6deg)}36%{transform:translate(4px,-2px) rotate(-6deg)}42%{transform:rotate(-6deg)}80%{opacity:1}100%{transform:scale(1.05) rotate(-6deg);opacity:0}}

/* ---------- capas (portada, modales) ---------- */
.capa{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:calc(var(--st) + 16px) 16px calc(var(--sb) + 16px)}
.capa.oscura{background:rgba(6,16,32,.66)}
.pergamino{background:#fff;color:var(--marino);border:3px solid var(--marino);border-radius:14px;padding:18px 16px 16px;width:min(100%,430px);max-height:100%;overflow:auto;box-shadow:6px 6px 0 var(--marino),0 14px 40px #0009;position:relative}
.pergamino h2{font-family:var(--dela);font-weight:400;margin:0 0 4px;font-size:24px;text-align:center;color:var(--marino);letter-spacing:.01em}
.pergamino .sub{text-align:center;font-weight:800;color:var(--suave);margin:0 0 14px;font-size:14px}
.pergamino p,.pergamino li{font-size:15px;line-height:1.4}
.pergamino ul{padding-left:20px;margin:6px 0}
.pergamino .x{position:absolute;top:6px;right:8px;width:36px;height:36px;border:0;background:none;color:var(--marino);font-size:28px;font-weight:800;cursor:pointer}
.pergamino .btn{transform:none;border-color:var(--marino);box-shadow:0 4px 0 var(--marino)}
.pergamino .btn > *{transform:none}
.pergamino .btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--marino)}
.pergamino .btn.fuego{box-shadow:0 4px 0 #8a3c06}
.pila{display:flex;flex-direction:column;gap:10px}
.linkbox{background:#eef6ff;border:2px dashed var(--agua);border-radius:8px;padding:9px;font-family:ui-monospace,monospace;font-size:13px;word-break:break-all;user-select:text;-webkit-user-select:text}
.niveles{display:flex;flex-direction:column;gap:6px;margin:8px 0 12px}
.nivel{display:flex;align-items:center;gap:10px;border:2px solid #c9d6e6;background:#f4f8ff;border-radius:10px;padding:8px 10px;cursor:pointer;text-align:left;color:var(--marino)}
.nivel .rk{font-family:var(--dela);font-size:14px;min-width:112px}
.nivel .tx{font-size:12.5px;color:var(--suave);line-height:1.2}
.nivel.sel{border-color:var(--naranja);background:#fff4d6;box-shadow:0 0 0 2px var(--naranja) inset}
.galon{display:flex;gap:2px;margin-left:auto}
.galon i{width:5px;height:14px;background:var(--paja);border:1.5px solid var(--marino);display:block;transform:skewX(-14deg)}
.interruptor{color:#fff;display:flex;align-items:center;gap:10px;border:2px solid rgba(255,255,255,.75);background:rgba(15,42,82,.78);border-radius:10px;padding:8px 12px;cursor:pointer}
.interruptor .t{flex:1}
.interruptor .t b{display:block;font-family:var(--dela);font-weight:400;font-size:14px}
.interruptor .t span{font-size:12px;color:var(--agua2)}
.llave{width:46px;height:26px;border-radius:13px;background:#5d6f88;position:relative;flex:none;transition:.2s;border:2px solid #fff}
.llave::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.interruptor.on .llave{background:var(--naranja)}
.interruptor.on .llave::after{left:22px}
.opciones{display:flex;gap:6px;flex-wrap:wrap}
.opciones button{flex:1;min-width:64px;border:2px solid #c9d6e6;background:#f4f8ff;border-radius:8px;padding:8px 6px;cursor:pointer;font-size:14px;font-weight:800;color:var(--marino)}
.opciones button.sel{border-color:var(--naranja);background:#fff4d6}

/* portada: la ilustración y el logo hechos en Canva */
#portada{flex-direction:column;justify-content:space-between;align-items:stretch;background:#0d3550 url(arte/portada.webp) 18% 100%/auto 132% no-repeat}
@media (min-aspect-ratio:3/5){#portada{background-size:cover;background-position:center 70%}}
#portada::before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(10,30,60,0) 55%,rgba(6,18,38,.8) 86%);pointer-events:none}
#portada .titulo{position:relative;text-align:center;margin-top:1vh;animation:logoEntra .9s cubic-bezier(.2,1.4,.4,1) both}
#portada .logo{position:relative;width:min(92vw,420px);margin:0 auto;aspect-ratio:900/576}
#portada .logo img{width:100%;height:100%;display:block;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
#portada .logo span{position:absolute;left:30%;right:30%;top:65.2%;height:7.5%;display:grid;place-items:center;font-family:var(--dela);font-size:clamp(9px,2.6vw,12.5px);color:#fff;letter-spacing:.06em;white-space:nowrap;text-shadow:1px 1px 0 #7a120c}
@keyframes logoEntra{0%{transform:scale(.4) rotate(-14deg);opacity:0}100%{transform:none;opacity:1}}
#portada .menu{position:relative;width:min(100%,400px);margin:0 auto;display:flex;flex-direction:column;gap:10px}
#portada .btn{font-size:17px;min-height:54px}
#portada .btn small{display:block;font-family:var(--redonda);font-weight:500;font-size:11.5px;opacity:.95;-webkit-text-stroke:0;text-shadow:none}
#portada .btn .tx{text-align:left;line-height:1.1}
#portada .btn.fuego small{color:var(--marino)}
#portada .pie{display:flex;gap:8px;justify-content:center}
#portada .pie .btn{flex:none;font-size:13px;min-height:36px;padding:6px 14px;background:rgba(15,42,82,.85)}
.invitado{background:var(--panel);border:2px solid var(--paja);border-radius:10px;padding:10px;text-align:center;margin-bottom:2px}
.invitado b{font-family:var(--dela);font-weight:400;font-size:17px;color:var(--paja);display:block}
.retrato{display:none}

/* chat */
#chat{position:fixed;left:0;right:0;bottom:0;z-index:45;padding:0 10px calc(var(--sb) + 10px)}
#chat .pergamino{width:100%;max-width:520px;margin:0 auto;max-height:70vh;display:flex;flex-direction:column}
#chatLog{flex:1;overflow:auto;min-height:60px;max-height:28vh;display:flex;flex-direction:column;gap:5px;margin:4px 0 8px;user-select:text;-webkit-user-select:text}
.msj{max-width:85%;padding:6px 10px;border-radius:12px;font-size:14.5px;line-height:1.25}
.msj.mio{align-self:flex-end;background:var(--azul);color:#fff}
.msj.suyo{align-self:flex-start;background:#eef6ff;border:1.5px solid #c9d6e6}
.frases{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
.frases button{border:2px solid #c9d6e6;background:#f4f8ff;border-radius:14px;padding:5px 10px;font-size:13.5px;font-weight:800;color:var(--marino);cursor:pointer}
.emojis button{font-size:20px;padding:4px 8px}
.escribir{display:flex;gap:6px}
.escribir input{flex:1;min-width:0;border:2px solid #c9d6e6;border-radius:8px;padding:10px;font-size:16px;font-family:var(--redonda);background:#fff;color:var(--marino);user-select:text;-webkit-user-select:text}

/* ---------- los vigías entran cruzando la pantalla (cut-in) ---------- */
#vineta{position:fixed;left:-12%;right:-12%;height:clamp(108px,30vw,150px);z-index:35;cursor:pointer}
#vineta .banda{position:absolute;inset:0;display:flex;align-items:center;gap:12px;overflow:hidden;padding:0 14%;
  border-block:4px solid #fff;box-shadow:0 0 0 2.5px var(--marino),0 12px 30px #0009;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 2px,transparent 2px 26px),linear-gradient(90deg,var(--marino),#1d5ea8)}
#vineta.r .banda{background:repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 2px,transparent 2px 26px),linear-gradient(90deg,#5a0e0b,#d0402a)}
#vineta.arriba{top:calc(var(--st) + 140px);transform:rotate(-7deg);animation:cutIn .34s cubic-bezier(.2,1.25,.4,1) both}
#vineta.abajo{bottom:calc(var(--sb) + 200px);transform:rotate(7deg);animation:cutInD .34s cubic-bezier(.2,1.25,.4,1) both}
#vineta.abajo .banda{flex-direction:row-reverse}
#vineta .panel{position:relative;flex:none;height:100%;aspect-ratio:.9;border-inline:5px solid var(--paja);background:#fff;overflow:hidden}
#vineta .cara{position:absolute;inset:0}
#vineta .cara img,#vineta .cara svg{width:100%;height:100%;object-fit:cover;object-position:50% 14%;display:block;animation:caraZoom 2.6s ease-out both}
@keyframes caraZoom{from{transform:scale(1.18)}to{transform:scale(1.02)}}
#vineta .nombre{position:absolute;left:0;right:0;bottom:0;text-align:center;font-family:var(--dela);font-size:12px;color:var(--marino);background:var(--paja);letter-spacing:.04em;padding:1px 0 2px}
#vineta .globo{flex:1;min-width:0;color:#fff;font-weight:800;font-size:clamp(15px,4.3vw,19px);line-height:1.18;text-shadow:2px 2px 0 rgba(0,0,0,.55);animation:dice .4s .12s ease-out both;padding-top:6px}
#vineta.abajo .globo{text-align:right}
/* la onomatopeya pisa el borde de arriba y sale de la franja */
#vineta .ono{position:absolute;right:15%;top:0;transform:translateY(-62%) rotate(-5deg);font-family:var(--dela);font-size:clamp(30px,9vw,46px);line-height:1;color:var(--paja);-webkit-text-stroke:2.5px var(--marino);
  text-shadow:4px 4px 0 var(--marino),0 0 0 #fff;white-space:nowrap;z-index:2;animation:onoGolpe .5s .1s cubic-bezier(.2,1.8,.4,1) both,tiembla .09s .6s 6;paint-order:stroke fill}
#vineta.abajo .ono{right:auto;left:15%;transform:translateY(-62%) rotate(5deg)}
#vineta.p .ono{color:#bff0ff}
#vineta.sale{animation:cutOut .26s ease-in both}
#vineta.abajo.sale{animation-name:cutOutD}
@keyframes cutIn{0%{transform:translateX(-110%) rotate(-7deg)}100%{transform:rotate(-7deg)}}
@keyframes cutInD{0%{transform:translateX(110%) rotate(7deg)}100%{transform:rotate(7deg)}}
@keyframes cutOut{to{transform:translateX(110%) rotate(-7deg)}}
@keyframes cutOutD{to{transform:translateX(-110%) rotate(7deg)}}
@keyframes dice{from{opacity:0;translate:-20px 0}}
@keyframes onoGolpe{0%{scale:3;opacity:0}100%{scale:1;opacity:1}}
@keyframes tiembla{0%{translate:-2px 1px}50%{translate:2px -1px}100%{translate:0 0}}

/* ---------- video del último barco ---------- */
#final{position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;opacity:0;transition:opacity .5s}
#final.on{opacity:1}
#final video{width:100%;max-height:78vh;aspect-ratio:4/3;object-fit:cover;display:block;background:#000}
#final .tit{font-family:var(--dela);font-size:clamp(26px,8vw,44px);color:var(--paja);-webkit-text-stroke:2px var(--marino);text-shadow:4px 4px 0 var(--marino);text-align:center;line-height:1;padding:0 16px;transform:rotate(-3deg);animation:onoGolpe .6s .4s cubic-bezier(.2,1.8,.4,1) both}
#final .tit small{display:block;font-family:var(--redonda);font-weight:800;font-size:.38em;-webkit-text-stroke:0;text-shadow:none;color:#fff;margin-top:8px}
#final .cargaV{color:#fff;font-weight:800;font-size:14px;opacity:.8}

/* ---------- el cartel de "SE BUSCA" ---------- */
.capa.busca{background:repeating-linear-gradient(90deg,#8a5a32 0 46px,#6e4424 46px 49px)}
.cartelSB{position:relative;width:min(100%,330px);background:#f2dfb4;color:#3b2410;box-shadow:0 10px 24px rgba(0,0,0,.5),inset 0 0 34px rgba(120,70,20,.35);
  display:grid;justify-items:center;gap:4px;padding:16px 16px 14px;transform:rotate(-2deg);animation:clavado .6s cubic-bezier(.2,1.5,.4,1) both}
.cartelSB::before,.cartelSB::after{content:"";position:absolute;top:8px;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#c9c9c9,#555);box-shadow:0 1px 2px #0008}
.cartelSB::before{left:10px}.cartelSB::after{right:10px}
@keyframes clavado{0%{transform:translateY(-60vh) rotate(-14deg)}100%{transform:rotate(-2deg)}}
.cartelSB b{font-family:var(--dela);font-weight:400;line-height:1}
.cartelSB .sb{font-size:40px;letter-spacing:.02em}
.cartelSB .foto{width:100%;aspect-ratio:1.15;border:3px solid #3b2410;overflow:hidden;background:#fff}
.cartelSB .foto img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;filter:sepia(.35) contrast(1.05)}
.cartelSB .vivo{font-size:13px;letter-spacing:.08em}
.cartelSB .nombre{font-size:30px}
.cartelSB .premio{font-size:24px;display:flex;align-items:baseline;gap:6px}
.cartelSB .premio small{font-family:var(--redonda);font-weight:800;font-size:12px}
.cartelSB table{width:100%;border-collapse:collapse;font-size:13.5px;font-weight:800;margin-top:6px;border-top:2px dashed #8a5a32}
.cartelSB td{padding:3px 2px;text-align:center}.cartelSB td:first-child{text-align:left}
.finBotones{display:flex;flex-direction:column;gap:9px;width:min(100%,330px);margin-top:16px}
.capa.busca .x{display:none}

/* ---------- modo película (hundimiento) ---------- */
#cine{position:fixed;inset:0;z-index:33;pointer-events:none}
#cine .barra{position:absolute;left:0;right:0;height:12vh;background:#000;transition:transform .7s cubic-bezier(.6,0,.3,1)}
#cine .barra.s{top:0;transform:translateY(-100%)}
#cine .barra.i{bottom:0;transform:translateY(100%)}
#cine.on .barra{transform:none}
#cine .gota{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.55),rgba(255,255,255,.08) 45%,rgba(180,210,230,.18) 70%,transparent 72%);
  backdrop-filter:blur(3px) brightness(1.1);-webkit-backdrop-filter:blur(3px) brightness(1.1);animation:gota 3.2s ease-in forwards}
@keyframes gota{0%{opacity:0;transform:scale(.4)}8%{opacity:1;transform:scale(1)}70%{opacity:.9}100%{opacity:0;transform:translateY(70px) scaleY(1.3)}}
body.pelicula #arriba,body.pelicula #abajo,body.pelicula #avisos{opacity:0;pointer-events:none;transition:opacity .4s}
#arriba,#abajo,#avisos{transition:opacity .4s}

#cargando{position:fixed;inset:0;z-index:60;background:var(--marino) url(arte/portada.webp) center/cover;display:grid;place-items:end center;padding-bottom:18vh;font-weight:800;color:#fff;font-size:17px;text-shadow:0 2px 8px #000;transition:opacity .6s}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>
</head>
