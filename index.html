<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#1c1610">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="iconos/icon-192.png">
<link rel="apple-touch-icon" href="iconos/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Batalla naval en el Río de la Plata, 1814. Patriotas contra realistas, pintada al óleo. Online con un amigo o contra la compu.">
<title>Proa del Plata</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script type="importmap">{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}</script>
<style>
:root{
  --tinta:#2a1d12; --papel:#efe2c2; --papel2:#e2cfa4; --borde:#8a6a3c; --oro:#d9b46a; --oro2:#f1d58f;
  --sangre:#8f2a1d; --sangre2:#b8402c; --azul:#2f5d8a; --celeste:#7fb0d8; --rojo:#c0392b;
  --panel:rgba(24,18,12,.78); --crema:#f3e7cc; --gris:#b8a98d;
  --st:env(safe-area-inset-top); --sb:env(safe-area-inset-bottom);
  --serif:"IM Fell English", Georgia, "Times New Roman", serif; --sc:"IM Fell English SC", Georgia, serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#1c1610;color:var(--crema);overflow:hidden;font-family:var(--serif);
  touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
button{font-family:inherit;color:inherit}
#lienzo{position:fixed;inset:0;width:100%;height:100%;display:block}
[hidden]{display:none!important}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- arriba ---------- */
#arriba{position:fixed;left:0;right:0;top:0;padding:calc(var(--st) + 8px) 10px 0;display:flex;flex-direction:column;gap:6px;pointer-events:none;z-index:10}
#arriba > *{pointer-events:auto}
.fila1{display:flex;align-items:center;gap:8px}
.redondo{width:42px;height:42px;border-radius:50%;border:1px solid #6b5432;background:var(--panel);display:grid;place-items:center;cursor:pointer;padding:0;flex:none;position:relative;color:var(--crema)}
.redondo:active{transform:scale(.94)}
.redondo .punto{position:absolute;top:4px;right:4px;width:9px;height:9px;border-radius:50%;background:var(--sangre2);border:1px solid #000}
#cartel{flex:1;min-width:0;text-align:center;background:linear-gradient(#f2e6c9,#e4d1a6);color:var(--tinta);border:1px solid var(--borde);
  border-radius:4px;padding:7px 12px 6px;font-size:16px;line-height:1.15;box-shadow:0 3px 10px #0007;position:relative}
#cartel::before,#cartel::after{content:"";position:absolute;top:6px;bottom:6px;width:4px;border-left:1px solid #8a6a3c66;border-right:1px solid #8a6a3c66}
#cartel::before{left:4px}#cartel::after{right:4px}
#cartelT{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
#cartelS{display:block;font-size:12.5px;font-style:italic;color:#6b5434;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cartel.mio{box-shadow:0 0 0 2px var(--oro2),0 3px 14px #000a}
.flotas{display:flex;gap:6px}
.flota{flex:1;min-width:0;background:var(--panel);border:1px solid #6b5432;border-radius:8px;padding:5px 8px;display:flex;align-items:center;gap:6px;font-size:13px}
.flota b{font-family:var(--sc);font-weight:400;font-size:13px;white-space:nowrap;letter-spacing:.2px;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pips{display:flex;gap:4px;flex-wrap:nowrap;margin-left:auto}
.nave{display:flex;gap:1.5px}
.nave i{width:4.5px;height:9px;border-radius:1.5px;background:currentColor;display:block}
.nave.hundida{opacity:.28}
.nave.hundida i{background:#888}
.flota.p{color:var(--celeste)} .flota.r{color:#e98a76}
.flota.p b,.flota.r b{color:var(--crema)}

/* ---------- abajo ---------- */
#abajo{position:fixed;left:0;right:0;bottom:0;padding:0 10px calc(var(--sb) + 10px);z-index:10;pointer-events:none}
#abajo > *{pointer-events:auto}
.tabla{background:linear-gradient(#efe2c2,#e0cba0);color:var(--tinta);border:1px solid var(--borde);border-radius:10px;padding:10px;box-shadow:0 -2px 16px #0008}
.tabla h3{margin:0 0 6px;font-family:var(--sc);font-weight:400;font-size:17px;display:flex;align-items:center;gap:8px}
.tabla h3 small{font-family:var(--serif);font-style:italic;font-size:13px;color:#6b5434;margin-left:auto}
.fichas{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px;scrollbar-width:none}
.fichas::-webkit-scrollbar{display:none}
.ficha{flex:none;min-width:86px;max-width:120px;border:1px solid #a0855a;background:#f6ecd3;border-radius:8px;padding:6px 8px;text-align:left;cursor:pointer;color:var(--tinta);position:relative}
.ficha .n{font-family:var(--sc);font-size:14px;display:flex;align-items:center;gap:5px;white-space:nowrap}
.ficha .d{font-size:11.5px;color:#6b5434;line-height:1.1;margin-top:2px}
.ficha.sel{border-color:var(--sangre);box-shadow:0 0 0 2px var(--sangre) inset;background:#fff6dc}
.ficha.mal{border-color:var(--rojo);background:#f8d9cf}
.ficha[disabled]{opacity:.42;cursor:default}
.ficha .tag{position:absolute;top:-7px;right:6px;font-size:10px;background:var(--tinta);color:var(--papel);border-radius:6px;padding:1px 5px;font-style:italic}
.ficha .nave{color:var(--azul);margin-top:3px}
.ficha .nave i{width:6px}
.botones{display:flex;gap:8px;margin-top:2px}
.btn{flex:1;border:1px solid #6e5330;border-radius:8px;padding:11px 10px;font-size:16px;background:#f6ecd3;color:var(--tinta);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;min-height:46px}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;cursor:default}
.btn.fuego{background:linear-gradient(#b8402c,#8f2a1d);color:#fff4df;border-color:#4a120a;font-family:var(--sc);font-size:18px;letter-spacing:.5px;flex:2;text-shadow:0 1px 0 #0006}
.btn.azul{background:linear-gradient(#3b6f9e,#2a5279);color:#fff;border-color:#183049}
.btn.chico{flex:none;padding:10px 12px}
#msjAbajo{font-size:14px;font-style:italic;color:#6b5434;margin:0 0 6px;min-height:18px;line-height:1.2}
#msjAbajo b{font-style:normal;color:var(--sangre)}
.espera{display:flex;align-items:center;gap:10px;font-size:15px}
.ola-anim{width:34px;height:20px;flex:none}

/* ---------- avisos ---------- */
#avisos{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--st) + 112px);z-index:20;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;width:min(92vw,420px)}
.aviso{background:var(--panel);border:1px solid #6b5432;color:var(--crema);padding:8px 14px;border-radius:20px;font-size:15px;text-align:center;box-shadow:0 4px 14px #0008;animation:entra .25s ease-out;max-width:100%}
.aviso.oro{border-color:var(--oro);color:var(--oro2)}
.aviso.rojo{border-color:var(--sangre2);color:#ffb19f}
.aviso.botella{background:linear-gradient(#f2e6c9,#e4d1a6);color:var(--tinta);border-color:var(--borde);border-radius:6px;font-style:italic}
@keyframes entra{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.aviso.sale{opacity:0;transition:opacity .4s}

#grito{position:fixed;inset:0;z-index:30;display:grid;place-items:center;pointer-events:none}
#grito .g{font-family:var(--sc);font-size:clamp(48px,15vw,110px);color:#fff1d6;text-shadow:0 0 18px #ff6a2a,0 4px 0 #5a1606,0 8px 30px #000;letter-spacing:2px;
  transform:rotate(-4deg);animation:grito 1.6s cubic-bezier(.2,1.6,.4,1) both;text-align:center;line-height:.95}
#grito .g small{display:block;font-family:var(--serif);font-style:italic;font-size:.28em;letter-spacing:0;text-shadow:0 2px 8px #000;margin-top:8px}
#grito.azul .g{text-shadow:0 0 18px #6fb4ff,0 4px 0 #0b2742,0 8px 30px #000}
@keyframes grito{0%{transform:scale(2.4) rotate(-10deg);opacity:0}25%{transform:scale(1) rotate(-4deg);opacity:1}80%{opacity:1}100%{transform:scale(1.05) rotate(-4deg);opacity:0}}

/* ---------- capas (portada, modales) ---------- */
.capa{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:calc(var(--st) + 16px) 16px calc(var(--sb) + 16px)}
.capa.oscura{background:rgba(12,9,6,.62)}
.pergamino{background:linear-gradient(#f2e6c9,#e0cba0);color:var(--tinta);border:1px solid var(--borde);border-radius:8px;padding:18px 18px 16px;width:min(100%,430px);max-height:100%;overflow:auto;box-shadow:0 10px 40px #000a;position:relative}
.pergamino h2{font-family:var(--sc);font-weight:400;margin:0 0 4px;font-size:26px;text-align:center}
.pergamino .sub{text-align:center;font-style:italic;color:#6b5434;margin:0 0 14px}
.pergamino p,.pergamino li{font-size:16px;line-height:1.35}
.pergamino ul{padding-left:20px;margin:6px 0}
.pergamino .x{position:absolute;top:8px;right:8px;width:36px;height:36px;border:0;background:none;color:var(--tinta);font-size:26px;cursor:pointer}
.pila{display:flex;flex-direction:column;gap:9px}
.linkbox{background:#fff8e6;border:1px dashed var(--borde);border-radius:6px;padding:9px;font-family:ui-monospace,monospace;font-size:13px;word-break:break-all;user-select:text;-webkit-user-select:text}
.niveles{display:flex;flex-direction:column;gap:6px;margin:8px 0 12px}
.nivel{display:flex;align-items:center;gap:10px;border:1px solid #a0855a;background:#f6ecd3;border-radius:8px;padding:8px 10px;cursor:pointer;text-align:left}
.nivel .rk{font-family:var(--sc);font-size:17px;min-width:118px}
.nivel .tx{font-size:13.5px;font-style:italic;color:#6b5434;line-height:1.15}
.nivel.sel{border-color:var(--sangre);box-shadow:0 0 0 2px var(--sangre) inset;background:#fff6dc}
.galon{display:flex;gap:2px;margin-left:auto}
.galon i{width:4px;height:14px;background:var(--oro);border:1px solid #6b5432;display:block;transform:skewX(-14deg)}
.interruptor{color:var(--tinta);display:flex;align-items:center;gap:10px;border:1px solid #a0855a;background:#f6ecd3;border-radius:8px;padding:9px 10px;cursor:pointer}
.interruptor .t{flex:1}
.interruptor .t b{display:block;font-family:var(--sc);font-weight:400;font-size:16px}
.interruptor .t span{font-size:13px;font-style:italic;color:#6b5434}
.llave{width:46px;height:26px;border-radius:13px;background:#b9a37a;position:relative;flex:none;transition:.2s}
.llave::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff8e6;transition:.2s;box-shadow:0 1px 3px #0006}
.interruptor.on .llave{background:#2a3f5e}
.interruptor.on .llave::after{left:23px}
.opciones{display:flex;gap:6px;flex-wrap:wrap}
.opciones button{flex:1;min-width:64px;border:1px solid #a0855a;background:#f6ecd3;border-radius:7px;padding:8px 6px;cursor:pointer;font-size:14px}
.opciones button.sel{border-color:var(--sangre);box-shadow:0 0 0 2px var(--sangre) inset;background:#fff6dc}

#portada{flex-direction:column;justify-content:space-between;background:linear-gradient(rgba(10,8,5,.1),rgba(10,8,5,0) 40%,rgba(10,8,5,.75) 78%)}
#portada .titulo{text-align:center;margin-top:4vh}
#portada h1{font-family:var(--sc);font-weight:400;font-size:clamp(46px,14vw,86px);margin:0;line-height:.9;color:#fff3da;
  text-shadow:0 2px 0 #3a2410,0 0 30px #000,0 6px 24px #000c;letter-spacing:1px}
#portada .lema{font-style:italic;font-size:18px;color:#f6e7c6;text-shadow:0 2px 10px #000;margin-top:8px}
#portada .orla{display:block;margin:10px auto 0;width:180px;height:14px;color:var(--oro);fill:none;stroke:currentColor}
#portada .menu{width:min(100%,400px);display:flex;flex-direction:column;gap:9px}
#portada .btn{font-size:18px;min-height:54px}
#portada .btn small{display:block;font-size:12.5px;font-style:italic;opacity:.8}
#portada .btn .tx{text-align:left;line-height:1.1}
#portada .pie{display:flex;gap:8px;justify-content:center}
#portada .pie .btn{flex:none;font-size:15px;min-height:40px;padding:8px 14px;background:rgba(24,18,12,.75);color:var(--crema);border-color:#6b5432}
.invitado{background:var(--panel);border:1px solid var(--oro);border-radius:10px;padding:12px;text-align:center;margin-bottom:4px}
.invitado b{font-family:var(--sc);font-weight:400;font-size:20px;color:var(--oro2);display:block}

/* chat */
#chat{position:fixed;left:0;right:0;bottom:0;z-index:45;padding:0 10px calc(var(--sb) + 10px)}
#chat .pergamino{width:100%;max-width:520px;margin:0 auto;max-height:70vh;display:flex;flex-direction:column}
#chatLog{flex:1;overflow:auto;min-height:60px;max-height:28vh;display:flex;flex-direction:column;gap:5px;margin:4px 0 8px;user-select:text;-webkit-user-select:text}
.msj{max-width:85%;padding:6px 10px;border-radius:10px;font-size:15px;line-height:1.25}
.msj.mio{align-self:flex-end;background:#2f5d8a;color:#fff}
.msj.suyo{align-self:flex-start;background:#fff8e6;border:1px solid #c9b48a}
.frases{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
.frases button{border:1px solid #a0855a;background:#f6ecd3;border-radius:14px;padding:6px 10px;font-size:14px;cursor:pointer}
.emojis button{font-size:20px;padding:4px 8px}
.escribir{display:flex;gap:6px}
.escribir input{flex:1;min-width:0;border:1px solid #a0855a;border-radius:8px;padding:10px;font-size:16px;font-family:var(--serif);background:#fff8e6;color:var(--tinta);user-select:text;-webkit-user-select:text}
#cargando{position:fixed;inset:0;z-index:60;background:#1c1610;display:grid;place-items:center;font-style:italic;color:var(--gris);font-size:18px;transition:opacity .6s}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
  <symbol id="i-son" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9c1.5 1.5 1.5 4.5 0 6M18.5 6.5c3 3 3 8 0 11"/></symbol>
  <symbol id="i-mudo" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/></symbol>
  <symbol id="i-botella" viewBox="0 0 24 24"><path d="M10 2h4v4l2 3v12a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1V9l2-3z"/><path d="M10 13h4M10 16h3"/></symbol>
  <symbol id="i-ojo" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-girar" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></symbol>
  <symbol id="i-dado" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9" r="1" fill="currentColor"/><circle cx="15" cy="15" r="1" fill="currentColor"/><circle cx="15" cy="9" r="1" fill="currentColor"/><circle cx="9" cy="15" r="1" fill="currentColor"/></symbol>
  <symbol id="i-ancla" viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><path d="M12 7v14M8 11h8M4 14c0 4 4 7 8 7s8-3 8-7"/></symbol>
  <symbol id="i-fuego" viewBox="0 0 24 24"><path d="M12 22c4 0 7-3 7-7 0-5-5-7-4-12-3 2-5 5-5 8-1-1-2-2-2-4-2 2-3 5-3 8 0 4 3 7 7 7z"/></symbol>
  <symbol id="i-andanada" viewBox="0 0 24 24"><circle cx="5" cy="12" r="2.4"/><circle cx="12" cy="12" r="2.4"/><circle cx="19" cy="12" r="2.4"/></symbol>
  <symbol id="i-bengala" viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M5.6 18.4l2.8-2.8M15.6 8.4l2.8-2.8"/><circle cx="12" cy="12" r="2"/></symbol>
  <symbol id="i-sondeo" viewBox="0 0 24 24"><path d="M12 2v13"/><path d="M9 15h6l-1 6h-4z"/><path d="M8 6h8"/></symbol>
  <symbol id="i-cruz" viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/><circle cx="5" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></symbol>
  <symbol id="i-mina" viewBox="0 0 24 24"><circle cx="12" cy="13" r="5"/><path d="M12 4v4M12 18v3M4 13h3M17 13h3M6.3 7.3l2.2 2.2M15.5 16.5l2.2 2.2M6.3 18.7l2.2-2.2M15.5 9.5l2.2-2.2"/></symbol>
  <symbol id="i-maniobra" viewBox="0 0 24 24"><path d="M3 12h18M7 8l-4 4 4 4M17 8l4 4-4 4"/></symbol>
  <symbol id="i-tiro" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5"/></symbol>
  <symbol id="i-orla" viewBox="0 0 180 14"><path d="M2 7h60M118 7h60M70 7c5-6 12-6 20 0s15 6 20 0M90 7c-5 6-12 6-20 0" stroke-width="1.4"/><circle cx="64" cy="7" r="1.6" fill="currentColor"/><circle cx="116" cy="7" r="1.6" fill="currentColor"/></symbol>
</svg>

<canvas id="lienzo"></canvas>

<!-- arriba -->
<div id="arriba" hidden>
  <div class="fila1">
    <button class="redondo" id="bMenu" aria-label="Menú"><svg class="i"><use href="#i-menu"/></svg></button>
    <div id="cartel"><span id="cartelT">—</span><span id="cartelS"></span></div>
    <button class="redondo" id="bChat" aria-label="Mensajes en botella" hidden><svg class="i"><use href="#i-botella"/></svg><span class="punto" id="chatPunto" hidden></span></button>
    <button class="redondo" id="bSonido" aria-label="Sonido"><svg class="i"><use href="#i-son"/></svg></button>
  </div>
  <div class="flotas">
    <div class="flota" id="flotaYo"><b id="flotaYoN">Tu flota</b><div class="pips"></div></div>
    <div class="flota" id="flotaEl"><b id="flotaElN">Enemigo</b><div class="pips"></div></div>
  </div>
</div>

<div id="avisos"></div>
<div id="grito" hidden></div>

<!-- abajo -->
<div id="abajo" hidden>
  <div class="tabla" id="tabla"></div>
</div>

<!-- portada -->
<div class="capa" id="portada" hidden>
  <div class="titulo">
    <h1>Proa del Plata</h1>
    <svg class="orla"><use href="#i-orla"/></svg>
    <div class="lema">Batalla naval en el Río de la Plata · 1814</div>
  </div>
  <div class="menu" id="menuPortada"></div>
</div>

<div class="capa oscura" id="modal" hidden><div class="pergamino" id="modalC"></div></div>

<div id="chat" hidden>
  <div class="pergamino">
    <button class="x" id="chatX" aria-label="Cerrar">×</button>
    <h2 style="font-size:21px">Mensajes en botella</h2>
    <div id="chatLog"></div>
    <div class="frases" id="frases"></div>
    <div class="frases emojis" id="emojis"></div>
    <form class="escribir" id="chatForm"><input id="chatIn" maxlength="140" placeholder="Escribí tu mensaje…" autocomplete="off"><button class="btn azul chico" type="submit">Tirar al agua</button></form>
  </div>
</div>

<div id="cargando">Preparando el río…</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
